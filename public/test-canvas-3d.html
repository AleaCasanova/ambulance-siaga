<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Def Real 3D Ambulance 360°</title>
    <style>
        body {
            background: #090d16;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        .map-wrapper {
            position: relative;
            width: 680px;
            height: 380px;
            background: #cbd5e1;
            background-image: 
                radial-gradient(circle at 50% 50%, #94a3b8 1.5px, transparent 1.5px),
                linear-gradient(to right, rgba(255,255,255,0.4) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(255,255,255,0.4) 2px, transparent 2px);
            background-size: 24px 24px, 120px 120px, 120px 120px;
            border-radius: 24px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 4px solid #1e293b;
        }

        /* Asphalt Road simulation */
        .road-strip {
            position: absolute;
            width: 100%;
            height: 70px;
            background: #334155;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .road-strip::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 4px;
            background-image: linear-gradient(to right, #facc15 60%, transparent 40%);
            background-size: 32px 100%;
        }

        /* 3D Marker Pin Container */
        .ambulance-3d-pin {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .ambulance-3d-pin:active { cursor: grabbing; }

        @keyframes patientPinPulse {
            0% { transform: translateX(-50%) scale(0.85); opacity: 0.85; }
            50% { transform: translateX(-50%) scale(1.35); opacity: 0.15; }
            100% { transform: translateX(-50%) scale(0.85); opacity: 0.85; }
        }

        .controls {
            margin-top: 24px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 580px;
            justify-content: center;
        }

        button {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
            transform: translateY(-1px);
        }
        button.active {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
            box-shadow: 0 0 14px rgba(2, 132, 199, 0.5);
        }

        .badge-hint {
            margin-top: 14px;
            font-size: 12px;
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.7);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>

    <h2 style="margin: 0 0 4px 0; font-weight: 800; letter-spacing: -0.5px;">Ekosistem Peta 3D Ambulans Siaga</h2>
    <p style="margin: 0 0 20px 0; font-size: 14px; color: #94a3b8;">Ambulans 3D Real (360°), Titik Jemput Pasien 3D (Pin Glossy), & Rumah Sakit 3D</p>

    <div class="map-wrapper">
        <div class="road-strip"></div>

        <!-- 1. Real 3D Ambulance Pin -->
        <div class="ambulance-3d-pin" id="pinContainer" style="margin-right: 50px;">
            <canvas id="ambCanvas" width="240" height="240" style="width: 120px; height: 120px;"></canvas>
        </div>

        <!-- 2. Real 3D Patient Location Pin (Pure Glossy Red Teardrop with Tip Radar Pulse) -->
        <div style="position: relative; width: 44px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; margin-right: 70px;">
            <div style="position: absolute; top: -14px; background: #991b1b; color: #fecaca; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; border: 1px solid #ef4444; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10;">📍 Lokasi Pasien 3D</div>
            <!-- Ground Radar Pulse Ring at Tip -->
            <div style="position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 34px; height: 12px; border-radius: 50%; background: radial-gradient(ellipse, rgba(239, 68, 68, 0.65) 0%, rgba(239, 68, 68, 0) 70%); border: 1px solid rgba(239, 68, 68, 0.75); pointer-events: none; animation: patientPinPulse 2.2s ease-in-out infinite;"></div>
            <!-- Ground Contact Shadow at Tip -->
            <div style="position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 18px; height: 6px; border-radius: 50%; background: rgba(15, 23, 42, 0.45); filter: blur(1.5px); pointer-events: none;"></div>
            <!-- 3D Patient Location Pin Image (Pure Red Only) -->
            <img src="/images/pin-pasien-3d.png" alt="Lokasi Pasien 3D" style="width: 42px; height: 62px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); position: relative; z-index: 2;" />
        </div>

        <!-- 3. Real 3D Hospital Landmark (Stationary, Isometric) -->
        <div style="position: relative; width: 85px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;">
            <div style="position: absolute; top: -14px; background: #065f46; color: #a7f3d0; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; border: 1px solid #10b981; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10;">🏥 RS Rujukan 3D</div>
            <!-- Asphalt Shadow -->
            <div style="position: absolute; bottom: 4px; width: 68px; height: 20px; border-radius: 50%; background: rgba(15, 23, 42, 0.45); filter: blur(4px); pointer-events: none;"></div>
            <!-- 3D Hospital Isometric Image -->
            <img src="/images/rumahsakit-3d.png" alt="Rumah Sakit 3D" style="width: 82px; height: 96px; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0,0,0,0.3)); position: relative; z-index: 2;" />
        </div>
    </div>

    <div class="badge-hint">💡 Klik & seret pada mobil untuk memutar 360° secara manual, atau pilih sudut di bawah:</div>

    <div class="controls">
        <button id="btnSpin" class="active" onclick="toggleSpin()">Auto Spin 360°</button>
        <button onclick="setAngle(0)">Depan (0°)</button>
        <button onclick="setAngle(45)">Isometrik Depan (45°)</button>
        <button onclick="setAngle(90)">Samping Kanan (90°)</button>
        <button onclick="setAngle(135)">Isometrik Belakang (135°)</button>
        <button onclick="setAngle(180)">Belakang Pintu (180°)</button>
        <button onclick="setAngle(225)">Isometrik Kiri (225°)</button>
        <button onclick="setAngle(270)">Samping Kiri (270°)</button>
    </div>

    <!-- 3D Ambulance Engine Script -->
    <script>
        const canvas = document.getElementById('ambCanvas');
        const ctx = canvas.getContext('2d');
        const pinContainer = document.getElementById('pinContainer');

        let currentAngle = 45 * Math.PI / 180;
        let targetAngle = currentAngle;
        let isSpinning = true;
        const pitch = 28 * Math.PI / 180; // Isometric tilt down
        const scale = 2.4; // Crisper, larger scale

        function toggleSpin() {
            isSpinning = !isSpinning;
            document.getElementById('btnSpin').classList.toggle('active', isSpinning);
        }

        function setAngle(deg) {
            isSpinning = false;
            document.getElementById('btnSpin').classList.remove('active');
            targetAngle = deg * Math.PI / 180;
        }

        // Drag to rotate 360
        let isDragging = false;
        let lastMouseX = 0;
        pinContainer.addEventListener('pointerdown', (e) => {
            isDragging = true;
            isSpinning = false;
            document.getElementById('btnSpin').classList.remove('active');
            lastMouseX = e.clientX;
            pinContainer.setPointerCapture(e.pointerId);
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            lastMouseX = e.clientX;
            currentAngle += dx * 0.02;
            targetAngle = currentAngle;
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        // Helper to construct 3D boxes
        function makeBox(minX, minY, minZ, maxX, maxY, maxZ, color, tags = {}) {
            return [
                // Front (+Z)
                { pts: [[minX,minY,maxZ],[maxX,minY,maxZ],[maxX,maxY,maxZ],[minX,maxY,maxZ]], normal: [0,0,1], color, ...tags, face: 'front' },
                // Back (-Z)
                { pts: [[maxX,minY,minZ],[minX,minY,minZ],[minX,maxY,minZ],[maxX,maxY,minZ]], normal: [0,0,-1], color, ...tags, face: 'back' },
                // Top (-Y)
                { pts: [[minX,minY,minZ],[maxX,minY,minZ],[maxX,minY,maxZ],[minX,minY,maxZ]], normal: [0,-1,0], color, ...tags, face: 'top' },
                // Bottom (+Y)
                { pts: [[minX,maxY,maxZ],[maxX,maxY,maxZ],[maxX,maxY,minZ],[minX,maxY,minZ]], normal: [0,1,0], color: '#1e293b', ...tags, face: 'bottom' },
                // Right (+X)
                { pts: [[maxX,minY,maxZ],[maxX,minY,minZ],[maxX,maxY,minZ],[maxX,maxY,maxZ]], normal: [1,0,0], color, ...tags, face: 'right' },
                // Left (-X)
                { pts: [[minX,minY,minZ],[minX,minY,maxZ],[minX,maxY,maxZ],[minX,maxY,minZ]], normal: [-1,0,0], color, ...tags, face: 'left' }
            ];
        }

        // Define High-Definition Ambulance 3D Polygons
        const polygons = [];

        // 1. Rear Medical Box (White Top + Red Bottom Half)
        // Rear upper white body (Length from -2 to +26, Width -14 to 14, Height -20 to 0)
        polygons.push(...makeBox(-14, -20, -2, 14, 0, 26, '#ffffff', { section: 'rear_white' }));
        // Rear lower red body stripe (Height 0 to 6)
        polygons.push(...makeBox(-14, 0, -2, 14, 6, 26, '#dc2626', { section: 'rear_red' }));

        // 2. Front Driver Cabin (Length from -26 to -2, Width -13.5 to 13.5)
        // Cabin hood / lower red
        polygons.push(...makeBox(-13.5, 0, -26, 13.5, 6, -2, '#dc2626', { section: 'cab_red' }));
        // Cabin front hood top
        polygons.push(...makeBox(-13.5, -4, -26, 13.5, 0, -14, '#ffffff', { section: 'cab_hood' }));
        // Cabin driver roof
        polygons.push(...makeBox(-13.5, -14, -14, 13.5, -4, -2, '#ffffff', { section: 'cab_roof' }));

        // Slanted Windshield
        polygons.push({
            pts: [[-13, -14, -14], [13, -14, -14], [13, -4, -25], [-13, -4, -25]],
            normal: [0, -0.6, -0.8],
            color: '#38bdf8',
            face: 'windshield',
            type: 'windshield'
        });

        // 3. Cabin Side Windows (Left & Right)
        polygons.push({
            pts: [[-13.6, -13, -13], [-13.6, -13, -3], [-13.6, -5, -3], [-13.6, -5, -13]],
            normal: [-1, 0, 0],
            color: '#38bdf8',
            face: 'left',
            type: 'cabin_win'
        });
        polygons.push({
            pts: [[13.6, -13, -3], [13.6, -13, -13], [13.6, -5, -13], [13.6, -5, -3]],
            normal: [1, 0, 0],
            color: '#38bdf8',
            face: 'right',
            type: 'cabin_win'
        });

        // 4. Wheels (3D Cylindrical blocks)
        function addWheel(cx, cy, cz) {
            const w = 4.5;
            const r = 5.2;
            polygons.push(...makeBox(cx - w/2, cy - r, cz - r, cx + w/2, cy + r, cz + r, '#0f172a', { type: 'wheel' }));
        }
        addWheel(-14.2, 6, -18); // FL
        addWheel(14.2, 6, -18);  // FR
        addWheel(-14.2, 6, 16);   // RL
        addWheel(14.2, 6, 16);    // RR

        // 5. Emergency Siren Bar on Roof
        polygons.push(...makeBox(-9, -25, -6, -1, -20, -2, '#ef4444', { type: 'siren_red' }));
        polygons.push(...makeBox(1, -25, -6, 9, -20, -2, '#3b82f6', { type: 'siren_blue' }));

        // Shading calculation
        const lightDir = [0.45, -0.85, -0.3];
        const len = Math.hypot(...lightDir);
        lightDir[0] /= len; lightDir[1] /= len; lightDir[2] /= len;

        function shadeColor(hex, lum) {
            hex = String(hex).replace(/[^0-9a-f]/gi, '');
            if (hex.length < 6) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
            lum = Math.max(-0.35, Math.min(0.3, lum));
            let rgb = '#';
            for (let i = 0; i < 3; i++) {
                let c = parseInt(hex.substr(i*2, 2), 16);
                c = Math.round(Math.min(Math.max(0, c + (c * lum)), 255)).toString(16);
                rgb += ('00' + c).substr(c.length);
            }
            return rgb;
        }

        let flashTimer = 0;
        let radarPulse = 0;

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isSpinning) {
                currentAngle += 0.022;
                if (currentAngle > Math.PI * 2) currentAngle -= Math.PI * 2;
                targetAngle = currentAngle;
            } else if (!isDragging) {
                currentAngle += (targetAngle - currentAngle) * 0.14;
            }

            flashTimer += 0.14;
            const flashRed = Math.sin(flashTimer) > 0;

            radarPulse = (radarPulse + 0.02) % 1;

            const cosY = Math.cos(currentAngle);
            const sinY = Math.sin(currentAngle);
            const cosX = Math.cos(pitch);
            const sinX = Math.sin(pitch);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 10;

            // 1. Draw Radar GPS Pulse on Ground
            ctx.save();
            ctx.beginPath();
            const rSize = 38 * scale * (0.4 + radarPulse * 0.6);
            ctx.ellipse(cx, cy + 24 * scale * 0.45, rSize, rSize * 0.45, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(14, 165, 233, ${Math.max(0, 0.7 - radarPulse * 0.7)})`;
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();

            // 2. Draw Ground Shadow
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx, cy + 26 * scale * 0.45, 24 * scale, 12 * scale, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
            ctx.filter = 'blur(6px)';
            ctx.fill();
            ctx.restore();

            // 3. Project 3D Polygons
            const transformed = [];

            for (const poly of polygons) {
                const screenPts = [];
                let avgZ = 0;

                for (const [x, y, z] of poly.pts) {
                    const sx = x * scale;
                    const sy = y * scale;
                    const sz = z * scale;

                    // Y-axis rotation (Yaw)
                    const x1 = sx * cosY + sz * sinY;
                    const z1 = -sx * sinY + sz * cosY;
                    // X-axis rotation (Pitch)
                    const y2 = sy * cosX - z1 * sinX;
                    const z2 = sy * sinX + z1 * cosX;

                    screenPts.push([cx + x1, cy + y2]);
                    avgZ += z2;
                }
                avgZ /= poly.pts.length;

                const [nx, ny, nz] = poly.normal;
                const nx1 = nx * cosY + nz * sinY;
                const nz1 = -nx * sinY + nz * cosY;
                const ny2 = ny * cosX - nz1 * sinX;
                const nz2 = ny * sinX + nz1 * cosX;

                // Backface culling
                if (nz2 < 0.05 || poly.type === 'windshield') {
                    const dot = -(nx1 * lightDir[0] + ny2 * lightDir[1] + nz2 * lightDir[2]);
                    const lum = (dot * 0.35);

                    let fillColor = shadeColor(poly.color, lum);

                    if (poly.type === 'siren_red') {
                        fillColor = flashRed ? '#ff1e1e' : '#7f1d1d';
                    } else if (poly.type === 'siren_blue') {
                        fillColor = !flashRed ? '#38bdf8' : '#0369a1';
                    } else if (poly.type === 'windshield' || poly.type === 'cabin_win') {
                        fillColor = shadeColor('#38bdf8', lum + 0.15);
                    }

                    transformed.push({
                        pts: screenPts,
                        z: avgZ,
                        fillColor,
                        poly,
                        normal: [nx1, ny2, nz2]
                    });
                }
            }

            // Painter's Algorithm: Sort by depth
            transformed.sort((a, b) => b.z - a.z);

            // Draw faces
            for (const item of transformed) {
                ctx.beginPath();
                ctx.moveTo(item.pts[0][0], item.pts[0][1]);
                for (let i = 1; i < item.pts.length; i++) {
                    ctx.lineTo(item.pts[i][0], item.pts[i][1]);
                }
                ctx.closePath();

                ctx.fillStyle = item.fillColor;
                ctx.fill();
                ctx.strokeStyle = item.fillColor;
                ctx.lineWidth = 0.8;
                ctx.stroke();

                // Decals & Details
                // Red Cross on Side and Rear Doors
                if (item.poly.section === 'rear_white') {
                    const midX = (item.pts[0][0] + item.pts[2][0]) / 2;
                    const midY = (item.pts[0][1] + item.pts[2][1]) / 2;

                    if (['left', 'right', 'back'].includes(item.poly.face)) {
                        ctx.save();
                        // White circular badge
                        ctx.beginPath();
                        ctx.arc(midX, midY, 8 * (scale / 2.4), 0, Math.PI * 2);
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowColor = 'rgba(0,0,0,0.15)';
                        ctx.shadowBlur = 3;
                        ctx.fill();

                        // Red Cross symbol
                        ctx.fillStyle = '#dc2626';
                        const crossW = 9 * (scale / 2.4);
                        const thick = 3 * (scale / 2.4);
                        ctx.fillRect(midX - thick/2, midY - crossW/2, thick, crossW);
                        ctx.fillRect(midX - crossW/2, midY - thick/2, crossW, thick);
                        ctx.restore();
                    }
                }

                // Front Headlights & Grille
                if (item.poly.section === 'cab_red' && item.poly.face === 'front') {
                    ctx.save();
                    // Chrome Grille
                    const midX = (item.pts[0][0] + item.pts[2][0]) / 2;
                    const topY = item.pts[0][1];
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(midX - 12, topY + 3, 24, 7);
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillRect(midX - 10, topY + 5, 20, 1.5);

                    // Dual Glowing Headlights
                    ctx.fillStyle = '#fef08a';
                    ctx.shadowColor = '#facc15';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc((item.pts[0][0]*0.75 + item.pts[1][0]*0.25), topY + 6, 3.5, 0, Math.PI*2);
                    ctx.arc((item.pts[0][0]*0.25 + item.pts[1][0]*0.75), topY + 6, 3.5, 0, Math.PI*2);
                    ctx.fill();
                    ctx.restore();
                }

                // Siren Light Glow Beacons
                if (item.poly.type === 'siren_red' && flashRed) {
                    ctx.save();
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = '#ff2222';
                    ctx.fill();
                    ctx.restore();
                } else if (item.poly.type === 'siren_blue' && !flashRed) {
                    ctx.save();
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = '#60a5fa';
                    ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
